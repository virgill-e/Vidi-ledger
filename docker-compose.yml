services:
  app:
    build: .
    container_name: vidi-ledger-app
    # No published port: Traefik (Dokploy domain) reaches the container on dokploy-network.
    environment:
      - DB_TYPE=${DB_TYPE:-postgres}
      - DATABASE_URL=${DATABASE_URL}
      - NUXT_SESSION_PASSWORD=${NUXT_SESSION_PASSWORD}
    restart: always
